# Netlify deploys this repo as-is: no build step.
[build]
  publish = "."

# Always fetch the latest app code, so updates reach everyone on their next open.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "no-cache"

# The React Native app's source lives in mobile/; it isn't part of the website.
[[redirects]]
  from = "/mobile/*"
  to = "/404"
  status = 404
  force = true
