# Netlify builds the Evenly app in mobile/ (Expo, React Native for web) and publishes the result.
[build]
  base = "mobile"
  command = "npx expo export --platform web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Build from what's in the repository; don't check Expo's servers for newer versions.
  EXPO_OFFLINE = "1"
  EXPO_NO_TELEMETRY = "1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The page and the service worker: always check for a newer version, so updates reach everyone on their next open.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"

# Built files have the content's fingerprint in their name, so they never change.
[[headers]]
  for = "/_expo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Every app address (/group/…, /expense/…, /account) is served by the one page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
